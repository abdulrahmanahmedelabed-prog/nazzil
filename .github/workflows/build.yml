name: Build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: Copy-Item -Recurse ../web ./web
        shell: pwsh
      - run: npm install
      - run: npm run fetch-bin
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Nazzil-Windows
          path: desktop/dist/*.exe

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle assembleRelease --no-daemon
      - run: |
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" | sed 's/app-/Nazzil-/; s/-release//')
            cp "$f" "out/$n"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Nazzil-Android
          path: android/out/*.apk

  # Publishes (or refreshes) the GitHub Release for the version in desktop/package.json.
  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: نزّل ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
          body: |
            **Windows:** `Nazzil-Setup.exe` (مثبّت) أو `Nazzil-Portable.exe` (بلا تثبيت).
            **Android:** `Nazzil-universal.apk`، أو ملف معمارية جهازك (`arm64-v8a` لمعظم الهواتف الحديثة) لحجم أصغر.
