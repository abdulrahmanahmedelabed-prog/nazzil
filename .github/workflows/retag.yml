# One-off: after the history rewrite (author e-mail → GitHub noreply), move the release tags to the
# rewritten commits so the old ones aren't kept reachable. Removed again right after it runs.
name: Retag after history rewrite
on:
  push:
    branches: [main]
    paths: [".github/workflows/retag.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Move tags to rewritten commits
        run: |
          git push --force origin 37e16687f07dda0a2a27783ab79b338b255c928c:refs/tags/v2.0.0
          git push --force origin c6d6930e475db6f204777aff9cb0174ede2331df:refs/tags/v3.0.0
          git push --force origin 77674435021c573cc2ae88ded18d1dfc654ea36d:refs/tags/v4.0.0
          git push --force origin ea5d750ec7826eeb060e33d6f58e0c5e8ddf2656:refs/tags/v4.1.0
          git push --force origin f7501f46ea76020357c7877596e0b5b9c04f2e22:refs/tags/v4.1.1
          git push --force origin e512d626028785dc4525d5bc88de230b23a53d41:refs/tags/v4.2.0
          git push --force origin d8198b86d0d247c86ec92ac17206b63f65a59c47:refs/tags/v4.3.0
          git push --force origin 45ca8ffa795809f266d39ad234f768c087de3656:refs/tags/v4.4.0
          git push --force origin 81244c47ca084951137657f9981e4de546242e04:refs/tags/v4.5.0
          git push --force origin 57c7531228596a133e762b1c93d4e6521e8f1ed8:refs/tags/v4.6.0
          git ls-remote --tags origin
